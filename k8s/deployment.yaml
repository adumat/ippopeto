apiVersion: apps/v1
kind: Deployment
metadata:
  name: gas-comune
  labels:
    app.kubernetes.io/name: gas-comune
spec:
  # Lo stato delle stanze sta in memoria: una sola replica, e niente rolling update
  # (due pod contemporanei dividerebbero i giocatori della stessa stanza).
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: gas-comune
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gas-comune
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      # Se il pacchetto su GHCR resta privato serve un pull secret:
      # imagePullSecrets:
      #   - name: ghcr-pull
      containers:
        - name: server
          image: ghcr.io/adumat/gas-comune:latest
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PORT
              value: "8080"
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 160Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
