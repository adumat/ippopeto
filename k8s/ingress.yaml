# Esempio generico: adatta classe, host e TLS al tuo cluster.
# Traefik gestisce i WebSocket senza configurazione aggiuntiva.
# Con ingress-nginx alza i timeout, altrimenti le connessioni cadono dopo 60 s:
#   nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
#   nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gas-comune
spec:
  # ingressClassName: traefik
  rules:
    - host: gas.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gas-comune
                port:
                  name: http
  # tls:
  #   - hosts: [gas.example.com]
  #     secretName: gas-comune-tls
